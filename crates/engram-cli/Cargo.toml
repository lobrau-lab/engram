[package]
name = "engram-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "engram"
path = "src/main.rs"

[dependencies]
engram-core = { path = "../engram-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
serde_json = "1"
